workflow:
  rules:
    # The Jenkins bridge is inert until JENKINS_JOB_URL is configured. Without it
    # the only job below can do nothing but fail its own missing-variable check,
    # so suppress the pipeline entirely rather than emit a red run per push.
    # This clears itself the moment the variable is set. Both comparisons are
    # required: an unset variable is null, and null == "" is false in GitLab.
    - if: '$JENKINS_JOB_URL == null || $JENKINS_JOB_URL == ""'
      when: never
    # Merge-request events are deliberately absent. The only job below cannot run
    # on an MR (protected variables are not exposed to it), and a pipeline whose
    # rules match no jobs is rejected by GitLab as an errored pipeline.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - when: never

stages:
  - bridge

default:
  image: node:22-bookworm
  tags:
    - linux
  interruptible: true

trigger_windows_jenkins:
  stage: bridge
  timeout: 120m
  rules:
    # Protected Jenkins variables are only used for trusted refs.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - when: never
  script:
    # Node ships its own CA bundle and ignores the system trust store, so it
    # rejects this GitLab's certificate chain even though git in the same
    # container clones over HTTPS happily. --use-openssl-ca points Node at the
    # system store; NODE_EXTRA_CA_CERTS adds the CA the runner mounts, when it
    # mounts one. Both are cheap and cover the two ways the CA can arrive.
    - |
      echo "CI_SERVER_TLS_CA_FILE=${CI_SERVER_TLS_CA_FILE:-<unset>}"
      if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ] && [ -f "${CI_SERVER_TLS_CA_FILE}" ]; then
        export NODE_EXTRA_CA_CERTS="${CI_SERVER_TLS_CA_FILE}"
        echo "Trusting runner-provided CA: ${CI_SERVER_TLS_CA_FILE}"
      fi
      node --use-openssl-ca -e "fetch(process.env.CI_API_V4_URL + '/version', {headers:{'PRIVATE-TOKEN':process.env.GITLAB_RELEASE_TOKEN||''}}).then(r => console.log('GitLab TLS reachable, HTTP ' + r.status)).catch(e => { console.error('GitLab TLS check failed:', e.cause?.code || e.message); process.exit(1); })"
    - node --use-openssl-ca scripts/trigger-jenkins.mjs

# Merge-request validation remains available in GitHub Actions until the
# protected Jenkins bridge is approved for merge-request pipelines.
