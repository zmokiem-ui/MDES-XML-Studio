workflow:
  rules:
    # Merge-request events are deliberately absent. The only job below cannot run
    # on an MR (protected variables are not exposed to it), and a pipeline whose
    # rules match no jobs is rejected by GitLab as an errored pipeline.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - when: never

stages:
  - bridge

default:
  image: node:22-bookworm
  tags:
    - linux
  interruptible: true

trigger_windows_jenkins:
  stage: bridge
  timeout: 120m
  rules:
    # Protected Jenkins variables are only used for trusted refs.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - when: never
  script:
    - node scripts/trigger-jenkins.mjs

# Merge-request validation remains available in GitHub Actions until the
# protected Jenkins bridge is approved for merge-request pipelines.
