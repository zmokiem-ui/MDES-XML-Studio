name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r requirements.txt -r requirements-build.txt

      - name: Run Python unit tests
        run: python -m pytest tests/unit -q

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: electron-app/package-lock.json
      
      - name: Install Node dependencies
        working-directory: electron-app
        run: npm ci

      - name: Audit production dependencies
        working-directory: electron-app
        run: npm audit --omit=dev --audit-level=high

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./electron-app/package.json').version"
          $pythonVersion = python -c "import crs_generator; print(crs_generator.__version__)"
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          if ($packageVersion -ne $tagVersion) {
            throw "Release tag $tagVersion does not match package version $packageVersion"
          }
          if ($pythonVersion -ne $tagVersion) {
            throw "Release tag $tagVersion does not match Python package version $pythonVersion"
          }

      - name: Run CLI regression matrix
        shell: pwsh
        run: tests\regression_test.ps1
      
      - name: Build Python backend
        run: python build_python_backend.py
      
      - name: Build Vite frontend
        working-directory: electron-app
        run: npm run build

      - name: Playwright smoke test
        working-directory: electron-app
        run: npm run test:e2e:smoke

      - name: Playwright full regression
        working-directory: electron-app
        run: npm run test:e2e:full

      - name: Build Electron installer
        working-directory: electron-app
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Playwright packaged application smoke
        working-directory: electron-app
        run: npm run test:e2e:packaged
        env:
          PACKAGED_APP_PATH: ${{ github.workspace }}\electron-app\dist-electron\win-unpacked\MDES XML Studio.exe

      - name: Upload installer to releases
        uses: softprops/action-gh-release@v2
        with:
          # *.blockmap ships alongside latest.yml so electron-updater can do
          # differential downloads; without it every update is a full re-download.
          files: |
            electron-app/dist-electron/*.exe
            electron-app/dist-electron/*.blockmap
            electron-app/dist-electron/latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
